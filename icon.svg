<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="forkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="godotBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5db4f2"/>
      <stop offset="100%" stop-color="#3777b5"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2.5"/>

  <!-- Left side: 3-pronged MCP fork with circular heads -->
  <g stroke="url(#forkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main stem connecting fork to Godot head -->
    <line x1="34" y1="64" x2="54" y2="64"/>
    <!-- Upper branch -->
    <path d="M 42 64 C 36 64, 34 38, 25 36"/>
    <!-- Middle branch -->
    <line x1="34" y1="64" x2="22" y2="64"/>
    <!-- Lower branch -->
    <path d="M 42 64 C 36 64, 34 90, 25 92"/>
  </g>
  <!-- Circular fork tips -->
  <circle cx="23" cy="36" r="7" fill="#0b1324" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="20" cy="64" r="7" fill="#0b1324" stroke="#60a5fa" stroke-width="3.5"/>
  <circle cx="23" cy="92" r="7" fill="#0b1324" stroke="#818cf8" stroke-width="3.5"/>

  <!-- Right side: Clean Godot-style robot head -->
  <g transform="translate(80, 64)">
    <!-- Outer silhouette: 3 top cogs + 2 side lugs + rounded jaw -->
    <path d="
      M -8 -29 L 8 -29 L 10 -22 L 17 -20 L 23 -25 L 30 -18 L 26 -11
      L 29 -5 L 35 -5 L 35 6 L 29 7
      C 29 22, 17 31, 0 31
      C -17 31, -29 22, -29 7
      L -35 6 L -35 -5 L -29 -5
      L -26 -11 L -30 -18 L -23 -25 L -17 -20 L -10 -22 Z"
      fill="url(#godotBlue)" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round"/>

    <!-- Eyes -->
    <circle cx="-12.5" cy="-1" r="7" fill="#ffffff"/>
    <circle cx="12.5" cy="-1" r="7" fill="#ffffff"/>
    <circle cx="-11.5" cy="-1" r="3.8" fill="#0b1324"/>
    <circle cx="11.5" cy="-1" r="3.8" fill="#0b1324"/>

    <!-- Nose -->
    <rect x="-2.2" y="-3" width="4.4" height="9" rx="2.2" fill="#ffffff"/>

    <!-- Classic Godot stepped jaw line -->
    <path d="M -24 11 L -13 11 L -11 15 L 11 15 L 13 11 L 24 11"
      fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
